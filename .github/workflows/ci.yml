name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carparty
          POSTGRES_PASSWORD: carparty
          POSTGRES_DB: carparty
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carparty" --health-interval 2s --health-retries 20
    env:
      DATABASE_URL: postgresql://carparty:carparty@localhost:5432/carparty?schema=public
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm build:packages
      - name: Schema, base seed and demo data on a fresh database
        run: pnpm --filter @carparty/database ensure-demo
      - run: pnpm --filter @carparty/api build
      - run: pnpm --filter @carparty/web build
      - run: pnpm --filter @carparty/landing build
      - name: API starts and answers
        env:
          JWT_SECRET: ci
          PORT: 4000
        run: |
          node apps/api/dist/main.js &
          for i in $(seq 1 30); do curl -sf http://localhost:4000/api/health && break; sleep 1; done
          curl -sf -X POST http://localhost:4000/api/auth/login -H "Content-Type: application/json" \
            -d '{"email":"admin@carparty.local","password":"admin123"}' > /dev/null
